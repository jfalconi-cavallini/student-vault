spring.application.name=student-vault

# Database: env vars in production, local defaults otherwise
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studentvault}
spring.datasource.username=${DB_USERNAME:vault}
spring.datasource.password=${DB_PASSWORD:vault}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
